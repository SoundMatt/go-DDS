version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - copyloopvar
    - misspell
    - bodyclose
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      - path: cyclone/cyclone\.go
        linters: [govet]
      # Deferred Close() calls in tests need not check the error;
      # the resource is being cleaned up and the error is unactionable.
      - path: _test\.go
        text: "Close.*is not checked"
        linters: [errcheck]

formatters:
  enable:
    - gofmt
