version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - copyloopvar
    - misspell
    - bodyclose
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      - path: cyclone/cyclone\.go
        linters: [govet]

formatters:
  enable:
    - gofmt
