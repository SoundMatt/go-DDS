version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - copyloopvar
    - misspell
    - bodyclose
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      - path: cyclone/cyclone\.go
        linters: [govet]
      # Deferred Close() calls in tests and example programs need not check the
      # error; the resource is being cleaned up and the error is unactionable.
      - path: _test\.go
        text: "Close.*is not checked"
        linters: [errcheck]
      - path: examples/
        text: "Close.*is not checked"
        linters: [errcheck]
      # noctx: pre-existing uses of net.Listen/net.Dial/exec.Command without a
      # context in admin, bridge/wan, monitor, and testutil. These are
      # functionally correct; threading context through the listener/dialer API
      # is tracked as a follow-up refactor.
      - path: "(admin|bridge/wan|monitor|testutil|shmem)/"
        linters: [noctx]

formatters:
  enable:
    - gofmt
