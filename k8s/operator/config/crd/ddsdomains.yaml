apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ddsdomains.dds.soundmatt.io
spec:
  group: dds.soundmatt.io
  scope: Namespaced
  names:
    kind: DDSDomain
    listKind: DDSDomainList
    plural: ddsdomains
    singular: ddsdomain
    shortNames:
      - ddsd
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: DomainID
          type: integer
          jsonPath: .spec.domainID
        - name: Isolated
          type: boolean
          jsonPath: .spec.isolateNamespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            DDSDomain governs the Kubernetes namespace it is created in:
            it supplies the namespace-wide default RTPS domain ID (used
            by DDSParticipant objects that don't set spec.domain
            explicitly, once the namespace is bound to this object via the
            dds.soundmatt.io/domain label) and, when isolateNamespace is
            true, the operator generates a matching NetworkPolicy scoping
            RTPS UDP traffic to the namespace (plus allowedNamespaces). See
            go-DDS ROADMAP.md, Milestone 15, "Kubernetes Operator".
          required: [spec]
          properties:
            spec:
              type: object
              required: [domainID]
              properties:
                domainID:
                  type: integer
                  minimum: 0
                  maximum: 232
                  description: RTPS domain ID (DDSI-RTPS §9.6.2.3).
                isolateNamespace:
                  type: boolean
                  default: false
                  description: >-
                    Generate a NetworkPolicy restricting this domain's RTPS
                    UDP ports to the namespace (plus allowedNamespaces).
                allowedNamespaces:
                  type: array
                  items:
                    type: string
                  description: >-
                    Additional namespaces (matched by the standard
                    kubernetes.io/metadata.name label) allowed to exchange
                    DDS traffic with this domain when isolateNamespace is
                    true.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
