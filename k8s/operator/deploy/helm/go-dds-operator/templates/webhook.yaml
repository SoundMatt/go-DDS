{{- $fullname := include "go-dds-operator.fullname" . -}}
{{- $secretName := .Values.tls.certSecretName | default (printf "%s-webhook-tls" $fullname) -}}
{{- $caBundle := "" -}}
{{- if .Values.tls.selfSigned -}}
{{- $dns := include "go-dds-operator.webhookServiceDNS" . -}}
{{- $ca := genCA (printf "%s-ca" $fullname) 3650 -}}
{{- $cert := genSignedCert $dns nil (list $dns) 3650 $ca -}}
{{- $caBundle = $ca.Cert | b64enc -}}
---
# The webhook server's TLS certificate. Generated fresh on every
# install/upgrade (see values.yaml "tls.selfSigned" for the tradeoff);
# both this Secret's tls.crt and the caBundle below come from the same
# genCA/genSignedCert call so they're always consistent with each other.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-dds-operator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $caBundle }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "go-dds-operator.labels" . | nindent 4 }}
  {{- if and (not .Values.tls.selfSigned) .Values.tls.certManagerCertificateName }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.tls.certManagerCertificateName }}
  {{- end }}
webhooks:
  - name: mutate-pods.dds.soundmatt.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    reinvocationPolicy: Never
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $fullname }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-pods
        port: {{ .Values.webhook.port }}
      {{- if .Values.tls.selfSigned }}
      caBundle: {{ $caBundle }}
      {{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    namespaceSelector:
      {{- toYaml .Values.webhook.namespaceSelector | nindent 6 }}
