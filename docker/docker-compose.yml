# go-DDS quickstart — multi-process DDS in under two minutes.
#
# Uses a named bridge network so this works on macOS and Windows Docker
# Desktop (where network_mode: host is unavailable). Each container discovers
# its peers via static unicast addresses using DDS_PEERS + WithNoMulticast.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up --build
#
# Then open http://localhost:8080 to view the live monitor dashboard.
# The pub container publishes a temperature reading every second; the sub
# container logs each received sample to stdout.
#
# Linux host networking (optional — faster multicast discovery):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.host.yml up --build

networks:
  dds:
    driver: bridge

services:
  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: monitor
    networks:
      - dds
    ports:
      - "8080:8080"
    environment:
      - MONITOR_ADDR=:8080
      - DDS_DOMAIN=0
      - DDS_PEERS=pub:7400,sub:7400
    restart: unless-stopped

  pub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: pub
    networks:
      - dds
    environment:
      - DDS_DOMAIN=0
      - DDS_PEERS=monitor:7400,sub:7400
    restart: unless-stopped
    depends_on:
      - monitor

  sub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: sub
    networks:
      - dds
    environment:
      - DDS_DOMAIN=0
      - DDS_PEERS=monitor:7400,pub:7400
    restart: unless-stopped
    depends_on:
      - monitor
