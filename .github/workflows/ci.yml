name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Pure-Go (mock) build, unit tests, and benchmarks ─────────────────────
  test-mock:
    name: Test (mock, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: go test (unit + fuzz seed corpus, -race)
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mock
          path: coverage.out

  # ── Benchmark smoke run ───────────────────────────────────────────────────
  # Runs every benchmark for exactly one iteration (-benchtime=1x) to catch
  # panics, deadlocks, and alloc-reporting regressions without spending wall
  # time on statistical sampling.
  benchmark-smoke:
    name: Benchmark smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go test -bench (smoke, 1 iteration each)
        run: >
          go test
          -bench=.
          -benchtime=1x
          -benchmem
          -run=^$
          ./mock/...
        # -run=^$ skips unit tests so output is purely benchmark lines.

      - name: go test -bench (smoke, parallel benchmarks)
        run: >
          go test
          -bench=BenchmarkPublish_Parallel
          -benchtime=100ms
          -benchmem
          -run=^$
          ./mock/...

  # ── Short fuzz run (seed corpus + a few seconds of engine exploration) ────
  # The full fuzzer is meant to be run locally or in dedicated infra; here we
  # run each fuzz target for 10 seconds to catch obvious regressions.
  fuzz-short:
    name: Fuzz (short, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: FuzzPublish
        run: go test -fuzz=^FuzzPublish$ -fuzztime=10s ./mock/...

      - name: FuzzPublishIsolation
        run: go test -fuzz=^FuzzPublishIsolation$ -fuzztime=10s ./mock/...

      - name: FuzzTopicName
        run: go test -fuzz=^FuzzTopicName$ -fuzztime=10s ./mock/...

      - name: FuzzNoRouting
        run: go test -fuzz=^FuzzNoRouting$ -fuzztime=10s ./mock/...

      - name: FuzzConcurrentPubSub (with race detector)
        run: go test -race -fuzz=^FuzzConcurrentPubSub$ -fuzztime=10s ./mock/...

      - name: FuzzDropOnFullChannel
        run: go test -fuzz=^FuzzDropOnFullChannel$ -fuzztime=10s ./mock/...

  # ── CycloneDDS CGo build (Linux only — requires system library) ───────────
  # libcyclonedds-dev is not in the Ubuntu 24.04 (Noble) apt repo; this job
  # is best-effort so CI is not blocked if the package is temporarily
  # unavailable. Mark the whole job continue-on-error.
  test-cyclone:
    name: Test (cyclone CGo, ubuntu-22.04)
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CycloneDDS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcyclonedds-dev

      - name: go vet (cyclone)
        run: go vet -tags cyclone ./...

      - name: go build (cyclone)
        run: go build -tags cyclone ./...

      - name: go test (cyclone, -race)
        run: go test -race -count=1 -tags cyclone -v ./cyclone/...

      - name: Benchmark smoke (cyclone)
        run: >
          go test
          -tags cyclone
          -bench=.
          -benchtime=1x
          -benchmem
          -run=^$
          ./cyclone/...

  # ── go generate (placeholder, expands when IDL toolchain is added) ────────
  generate:
    name: go generate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go generate
        run: go generate ./...
      - name: Diff check (generated files must be committed)
        run: git diff --exit-code

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
