name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Pure-Go (mock) build, unit tests, and benchmarks ─────────────────────
  test-mock:
    name: Test (mock, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (core module)
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (unit + fuzz seed corpus, -race)
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-mock
          path: coverage.out

  # ── Benchmark smoke run ───────────────────────────────────────────────────
  # Runs every benchmark for exactly one iteration (-benchtime=1x) to catch
  # panics, deadlocks, and alloc-reporting regressions without spending wall
  # time on statistical sampling.
  benchmark-smoke:
    name: Benchmark smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: go test -bench (smoke, 1 iteration each)
        run: >
          go test
          -bench=.
          -benchtime=1x
          -benchmem
          -run=^$
          ./mock/...
        # -run=^$ skips unit tests so output is purely benchmark lines.

      - name: go test -bench (smoke, parallel benchmarks)
        run: >
          go test
          -bench=BenchmarkPublish_Parallel
          -benchtime=100ms
          -benchmem
          -run=^$
          ./mock/...

  # ── Short fuzz run (seed corpus + a few seconds of engine exploration) ────
  # The full fuzzer is meant to be run locally or in dedicated infra; here we
  # run each fuzz target for 10 seconds to catch obvious regressions.
  fuzz-short:
    name: Fuzz (short, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Clear fuzz corpus cache
        run: go clean -fuzzcache

      - name: FuzzPublish
        run: go test -fuzz=^FuzzPublish$ -fuzztime=10s ./mock/...

      - name: FuzzPublishIsolation
        run: go test -fuzz=^FuzzPublishIsolation$ -fuzztime=10s ./mock/...

      - name: FuzzTopicName
        run: go test -fuzz=^FuzzTopicName$ -fuzztime=10s ./mock/...

      - name: FuzzNoRouting
        run: go test -fuzz=^FuzzNoRouting$ -fuzztime=10s ./mock/...

      - name: FuzzConcurrentPubSub (with race detector)
        run: go test -race -fuzz=^FuzzConcurrentPubSub$ -fuzztime=10s ./mock/...

      - name: FuzzDropOnFullChannel
        run: go test -fuzz=^FuzzDropOnFullChannel$ -fuzztime=10s ./mock/...

      # idl now lives in the tools/ submodule (ROADMAP.md "Architecture
      # Initiative" #71, Phase C) — run its fuzz targets from there.
      - name: FuzzIDLParser
        working-directory: tools
        run: go test -fuzz=^FuzzIDLParser$ -fuzztime=10s ./idl

      - name: FuzzIDLGenerate
        working-directory: tools
        run: go test -fuzz=^FuzzIDLGenerate$ -fuzztime=10s ./idl

  # ── Pure-Go RTPS/UDP implementation ──────────────────────────────────────
  # Wire-format unit tests always pass. Intra-process socket tests skip
  # gracefully if UDP multicast is unavailable. The two-participant test is
  # gated behind -short so the 2.2 s SPDP wait does not slow CI.
  test-rtps:
    name: Test (rtps, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: go vet (rtps + security)
        run: go vet ./rtps/... ./security/...

      - name: go test (rtps wire + intra-process, -race)
        run: go test -race -count=1 -short -v ./rtps/... ./security/...

  # ── safety submodule (independent go.mod, ROADMAP.md "Architecture
  # Initiative" #71 Phase A) — builds/tests standalone from ./safety, using
  # its `replace github.com/SoundMatt/go-DDS => ../` for in-repo development.
  test-safety:
    name: Test (safety module, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (safety module)
        working-directory: safety
        run: go build ./...

      - name: go vet (safety module)
        working-directory: safety
        run: go vet ./...

      - name: go test (safety module, -race)
        shell: bash
        working-directory: safety
        run: go test -race -count=1 ./...

  # ── bridge submodule (independent go.mod, ROADMAP.md "Architecture
  # Initiative" #71 Phase B) — builds/tests standalone from ./bridge, using
  # its `replace github.com/SoundMatt/go-DDS => ../` for in-repo development.
  # Module path is `.../go-DDS/bridge` (matching the existing `bridge/`
  # directory, not the roadmap's provisional "bridges" group name) so
  # `bridge/grpc`, `bridge/rest`, and `bridge/wan` keep their current import
  # paths unchanged — see ROADMAP.md "Module Naming Caveat".
  test-bridge:
    name: Test (bridge module, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (bridge module)
        working-directory: bridge
        run: go build ./...

      - name: go vet (bridge module)
        working-directory: bridge
        run: go vet ./...

      - name: go test (bridge module, -race)
        shell: bash
        working-directory: bridge
        run: go test -race -count=1 ./...

  # ── tools submodule (independent go.mod, ROADMAP.md "Architecture
  # Initiative" #71 Phase C) — builds/tests standalone from ./tools, using
  # its `replace github.com/SoundMatt/go-DDS => ../` for in-repo development.
  # Module path is `.../go-DDS/tools`, gathering idl, cdr, xtypes, cmd/ddstool,
  # and cmd/go-dds — unlike bridge/safety, these packages did not already
  # share a common directory, so (unlike Phase B) this phase moved them under
  # a new tools/ directory and their import paths changed accordingly (e.g.
  # `.../idl` -> `.../tools/idl`) — see ROADMAP.md Phase C note and "Module
  # Naming Caveat".
  test-tools:
    name: Test (tools module, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (tools module)
        working-directory: tools
        run: go build ./...

      - name: go vet (tools module)
        working-directory: tools
        run: go vet ./...

      - name: go test (tools module, -race)
        shell: bash
        working-directory: tools
        run: go test -race -count=1 ./...

  # ── observability submodule (independent go.mod, ROADMAP.md "Architecture
  # Initiative" #71 Phase D) — builds/tests standalone from ./observability,
  # using its `replace github.com/SoundMatt/go-DDS => ../` for in-repo
  # development. Module path is `.../go-DDS/observability`, gathering
  # monitor, admin, otel, services, record, and cmd/monitor — like tools/
  # (Phase C, unlike bridge/safety), these packages did not already share a
  # common directory, so this phase moved them under a new observability/
  # directory and their import paths changed accordingly (e.g. `.../monitor`
  # -> `.../observability/monitor`) — see ROADMAP.md Phase D note and
  # "Module Naming Caveat". Takes its `safety` dependency (monitor imports
  # safety/tsn) from the tagged safety/v0.1.0 module, not a relative-path
  # replace, since Phase A already shipped a stable tagged safety module.
  test-observability:
    name: Test (observability module, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (observability module)
        working-directory: observability
        run: go build ./...

      - name: go vet (observability module)
        working-directory: observability
        run: go vet ./...

      - name: go test (observability module, -race)
        shell: bash
        working-directory: observability
        run: go test -race -count=1 ./...

  # ── examples submodule (independent go.mod, ROADMAP.md "Architecture
  # Initiative" #71 Phase E) — builds/tests standalone from ./examples,
  # using its `replace github.com/SoundMatt/go-DDS => ../` for in-repo
  # development. Module path is `.../go-DDS/examples`, gathering
  # `examples/*` and `cmd/latmon` — like tools/observability (Phases C/D),
  # `cmd/latmon` did not already live under `examples/`, so this phase moved
  # it to `examples/cmd/latmon` and its install path changed accordingly —
  # see ROADMAP.md Phase E note and "Module Naming Caveat". Deliberately
  # last among all module legs: examples exist to exercise the *released*
  # module boundaries, so they take their `observability` dependency (only
  # `examples/otel-tracing` needs it) from the tagged observability/v0.1.0
  # module, never a relative-path replace — see ROADMAP.md Target Layout.
  test-examples:
    name: Test (examples module, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (examples module)
        working-directory: examples
        run: go build ./...

      - name: go vet (examples module)
        working-directory: examples
        run: go vet ./...

      - name: go test (examples module, -race)
        shell: bash
        working-directory: examples
        run: go test -race -count=1 ./...

  # ── k8s/operator submodule (independent go.mod, ROADMAP.md Milestone 15
  # "Kubernetes Operator") — builds/tests standalone from ./k8s/operator.
  # Unlike bridge/tools/observability/examples/safety, this module does not
  # depend on the root github.com/SoundMatt/go-DDS package at all (it only
  # talks to the Kubernetes API via k8s.io/api, k8s.io/apimachinery, and
  # k8s.io/client-go), so it carries no `replace` directive back to the
  # repo root — see k8s/operator/README.md.
  test-k8s-operator:
    name: Test (k8s/operator module, ${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go build (k8s/operator module)
        working-directory: k8s/operator
        run: go build ./...

      - name: go vet (k8s/operator module)
        working-directory: k8s/operator
        run: go vet ./...

      - name: go test (k8s/operator module, -race)
        shell: bash
        working-directory: k8s/operator
        run: go test -race -count=1 ./...

  # ── WebAssembly Target build gate (ROADMAP.md Milestone 16, "WebAssembly
  # Target") ──────────────────────────────────────────────────────────────
  # Proves the two Wasm build targets this sub-phase adds compile cleanly:
  #   - GOOS=wasip1 GOARCH=wasm — the "cloud function" target (Fastly
  #     Compute, Cloudflare Workers, Wasmtime; see docs/WASM_DEPLOYMENT.md)
  #     — across every module, since none of them need GOOS-specific code
  #     to support it (mock/rtps use only the standard net/tls packages,
  #     which wasip1 backs with real WASI socket syscalls).
  #   - GOOS=js GOARCH=wasm — the browser target
  #     (examples/wasm-subscriber/) — built explicitly via its own build.sh
  #     wrapper (not just `go build`) so the wasm_exec.js-copying step is
  #     exercised too, not just the compile.
  # `go vet` runs for wasip1 as well (js/wasm's net package is real-enough
  # that vet's static checks are still meaningful there); it does not run
  # against GOOS=js for the whole repo since only examples/wasm-subscriber
  # targets it, and that package is vetted on its own right after building.
  wasm-build:
    name: Wasm build (wasip1 + js/wasm browser target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: go build (wasip1, root module)
        run: GOOS=wasip1 GOARCH=wasm go build ./...

      - name: go vet (wasip1, root module)
        run: GOOS=wasip1 GOARCH=wasm go vet ./...

      - name: go build (wasip1, bridge/tools/observability/safety/examples modules)
        run: |
          set -e
          for mod in bridge tools observability safety examples; do
            echo "== $mod (wasip1) =="
            (cd "$mod" && GOOS=wasip1 GOARCH=wasm go build ./...)
          done

      - name: Build wasm-subscriber (js/wasm browser target, via build.sh)
        working-directory: examples
        run: ./wasm-subscriber/build.sh

      - name: go vet (js/wasm, wasm-subscriber)
        working-directory: examples
        run: GOOS=js GOARCH=wasm go vet ./wasm-subscriber/...

  # ── RELAY conformance gate (spec §12 CLI documents + §11.2 interop) ────────
  # Validates the go-dds CLI against the JSON Schemas embedded in the pinned
  # relay binary (authoritative, unlike hand-rolled JSON asserts), then checks
  # the convert driver is behaviourally interchangeable with the RELAY
  # reference for every DDS golden vector. Pin the relay version so spec bumps
  # are an explicit upgrade, not a surprise CI break (tracks RELAY v1.14).
  #
  # v1.14.0 is pinned rather than the newer v2.0.0 because v2.0.0's go.mod
  # still declares `module github.com/SoundMatt/RELAY` (no `/v2` suffix),
  # which violates Go's semantic import versioning rule for v2+ modules and
  # makes it uninstallable via normal `go get`/`go install` — see
  # SoundMatt/RELAY#68. v1.14.0 is otherwise the latest available and
  # includes v1.13's `spec/vectors/errors/*.json` go:embed fix that makes
  # reject-path golden vectors (e.g. dds-domain-out-of-range.json) reachable
  # through `relay interop --strict`.
  relay-conform:
    name: RELAY conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install relay CLI
        run: go install github.com/SoundMatt/RELAY/cmd/relay@v1.14.0

      # cmd/go-dds moved into the tools/ submodule (ROADMAP.md "Architecture
      # Initiative" #71, Phase C).
      - name: Build go-dds CLI
        working-directory: tools
        run: go build -o /tmp/go-dds ./cmd/go-dds

      - name: relay conform --strict
        run: relay conform --strict /tmp/go-dds

      - name: relay interop --protocol DDS --strict
        run: relay interop --protocol DDS --strict /tmp/go-dds

  # ── CycloneDDS CGo build (Linux only — requires system library) ───────────
  # libcyclonedds-dev is not reliably available in the Ubuntu 22.04 apt repo.
  # The install step probes availability and sets an output flag; all
  # subsequent steps are conditioned on that flag so the job exits cleanly
  # (green) rather than red when the package is absent.
  test-cyclone:
    name: Test (cyclone CGo, ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install CycloneDDS
        id: install
        run: |
          sudo apt-get update -q
          if sudo apt-get install -y libcyclonedds-dev; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::libcyclonedds-dev not available in apt — skipping cyclone build/test"
          fi

      - name: go vet (cyclone)
        if: steps.install.outputs.available == 'true'
        run: go vet -tags cyclone ./...

      - name: go build (cyclone)
        if: steps.install.outputs.available == 'true'
        run: go build -tags cyclone ./...

      - name: go test (cyclone, -race)
        if: steps.install.outputs.available == 'true'
        run: go test -race -count=1 -tags cyclone -v ./cyclone/...

      - name: Benchmark smoke (cyclone)
        if: steps.install.outputs.available == 'true'
        run: >
          go test
          -tags cyclone
          -bench=.
          -benchtime=1x
          -benchmem
          -run=^$
          ./cyclone/...

  # ── RTPS interop against CycloneDDS (optional, service-gated) ───────────────
  # Starts a CycloneDDS container, waits for SPDP discovery, then runs the
  # bidirectional echo test. The job is skipped if the cyclonedds Docker image
  # is unavailable in the runner's registry.
  test-interop:
    name: RTPS interop (CycloneDDS, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Probe Docker and CycloneDDS image
        id: probe
        run: |
          if docker pull eclipse-cyclonedds/cyclonedds:latest 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CycloneDDS Docker image not available — skipping interop tests"
          fi

      - name: Start CycloneDDS peer
        if: steps.probe.outputs.available == 'true'
        run: docker compose -f interop/docker-compose.yml up -d cyclone-peer

      - name: go test (interop, -tags interop)
        if: steps.probe.outputs.available == 'true'
        run: go test -tags interop -v -timeout 60s -run '^TestInterop_(GoPublisher|CyclonePublisher|BidirectionalEcho)' ./interop/...
        env:
          INTEROP_TIMEOUT: "15s"

      - name: Stop CycloneDDS peer
        if: steps.probe.outputs.available == 'true'
        run: docker compose -f interop/docker-compose.yml down

  # ── ROS 2 interop (Milestone 17, "ROS 2 / rmw Compatibility") ─────────────
  # Same probe-and-skip pattern as test-interop above, against live ROS 2
  # Jazzy and Rolling `demo_nodes_cpp talker` peers instead of CycloneDDS —
  # see interop/ros2_test.go and interop/docker-compose.yml's ros2-*-talker
  # services. The job is skipped (per distro) if that distro's image is
  # unavailable in the runner's registry.
  test-interop-ros2:
    name: RTPS interop (ROS 2, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Probe Docker and ROS 2 images
        id: probe
        run: |
          jazzy=false
          rolling=false
          if docker pull ros:jazzy 2>/dev/null; then jazzy=true; else echo "::notice::ros:jazzy image not available — skipping Jazzy interop test"; fi
          if docker pull ros:rolling 2>/dev/null; then rolling=true; else echo "::notice::ros:rolling image not available — skipping Rolling interop test"; fi
          echo "jazzy=$jazzy" >> "$GITHUB_OUTPUT"
          echo "rolling=$rolling" >> "$GITHUB_OUTPUT"

      - name: Start ROS 2 Jazzy talker
        if: steps.probe.outputs.jazzy == 'true'
        run: docker compose -f interop/docker-compose.yml --profile jazzy up -d

      - name: go test (ROS 2 Jazzy, -tags interop)
        if: steps.probe.outputs.jazzy == 'true'
        run: go test -tags interop -v -timeout 60s -run ROS2Jazzy ./interop/...
        env:
          INTEROP_TIMEOUT: "15s"

      - name: Stop ROS 2 Jazzy talker
        if: steps.probe.outputs.jazzy == 'true'
        run: docker compose -f interop/docker-compose.yml --profile jazzy down

      - name: Start ROS 2 Rolling talker
        if: steps.probe.outputs.rolling == 'true'
        run: docker compose -f interop/docker-compose.yml --profile rolling up -d

      - name: go test (ROS 2 Rolling, -tags interop)
        if: steps.probe.outputs.rolling == 'true'
        run: go test -tags interop -v -timeout 60s -run ROS2Rolling ./interop/...
        env:
          INTEROP_TIMEOUT: "15s"

      - name: Stop ROS 2 Rolling talker
        if: steps.probe.outputs.rolling == 'true'
        run: docker compose -f interop/docker-compose.yml --profile rolling down

  # ── go generate (placeholder, expands when IDL toolchain is added) ────────
  generate:
    name: go generate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: go generate
        run: go generate ./...
      - name: Diff check (generated files must be committed)
        run: git diff --exit-code

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ── Static analysis (informational) ───────────────────────────────────────
  # The BLOCKING static-analysis gate is already provided by other jobs:
  #   • go vet ./...        — the `test` job
  #   • golangci-lint run   — the `lint` job (govet, staticcheck, unused,
  #                           errcheck, ineffassign, …)
  #   • go test -race ./... — the `test` job
  # The checks below add extra signal but are intentionally NON-blocking:
  # `deadcode` reports every exported symbol consumed only by downstream users
  # as "unreachable" (this is a library, so that is hundreds of false
  # positives), and `gocyclo` is a complexity advisory, not a hard limit.
  static-analysis:
    name: Static analysis (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: deadcode (informational)
        run: go run golang.org/x/tools/cmd/deadcode@v0.30.0 ./... || true
      - name: gocyclo complexity hotspots (informational)
        run: go run github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0 -over 15 -top 20 ./... || true

  # ── go-FuSa full lifecycle (RELAY §20 continuous conformance) ──────────────
  # Pinned to v0.36.0. RELAY spec §20 makes conformance continuously proven:
  # this job runs the FULL go-FuSa lifecycle and gates on every stage —
  # static analysis (check), 100% requirement traceability (traced AND tested),
  # cybersecurity analysis (cyber), dependency vulnerability scan (vuln), and
  # the tool-qualification suite (qualify). Any ERROR / finding / failure fails
  # the build. To upgrade: install the new version locally, run the same
  # commands, fix all findings, then bump the @version pin below.
  gofusa:
    name: go-FuSa lifecycle §20 (v0.36.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.36.0
      - name: gofusa check (0 errors required)
        run: gofusa check ./...
      - name: Verify required safety artifacts are present
        run: |
          missing=0
          for f in \
            .fusa.json \
            .fusa-reqs.json \
            .fusa-hara.json \
            .fusa-problems.json \
            .fusa-iec62443.json \
            SECURITY.md \
            INCIDENT-RESPONSE.md \
            SAFETY_PLAN.md \
            .github/CODEOWNERS; do
            if [ ! -f "$f" ]; then
              echo "::error::Required safety artifact missing: $f"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
      - name: Verify traceability (100% traced AND tested — §20.1.2)
        run: |
          gofusa trace --format json -output /tmp/trace.json
          python3 - << 'PYEOF'
          import json, sys
          d = json.load(open('/tmp/trace.json'))
          cov = d.get('coverage', {})
          total  = cov.get('totalRequirements', 0)
          traced = cov.get('tracedRequirements', 0)
          tested = cov.get('testedRequirements', 0)
          if total == 0:
              print("::error::No requirements found in .fusa-reqs.json")
              sys.exit(1)
          fail = False
          if traced < total:
              print(f"::error::Untraced requirements: {total - traced} of {total}")
              fail = True
          if tested < total:
              print(f"::error::Untested requirements: {total - tested} of {total}")
              fail = True
          if fail:
              sys.exit(1)
          print(f"Traceability: {total}/{total} requirements traced and tested")
          PYEOF
      - name: Cybersecurity analysis (0 errors — §20.1.2)
        run: gofusa cyber
      - name: Dependency vulnerability scan (§20.1.2)
        run: gofusa vuln
      - name: Tool qualification suite (§20.1.2)
        run: gofusa qualify
