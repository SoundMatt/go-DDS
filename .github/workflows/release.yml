name: Release

# Runs on every vX.Y.Z tag push.
# Regenerates all gofusa safety artifacts (fmea, safety-case, sbom,
# provenance, artifact-manifest) and commits them back to main so the
# committed files always reflect the exact state at each release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # needed to push the artifact-update commit + upload release assets
  attestations: write   # needed to publish the build provenance attestation
  id-token: write       # needed to mint the attestation's signing identity

jobs:
  regenerate-safety-artifacts:
    name: Regenerate safety artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so we can push back to main.
          fetch-depth: 0
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.47.0

      - name: Regenerate dFMEA table
        run: gofusa fmea -cyber

      - name: Regenerate safety case
        run: gofusa safety-case

      - name: Regenerate SBOM, provenance, and artifact manifest
        run: gofusa release

      - name: Regenerate lifecycle evidence (SCI, TARA, coupling, boundary, cyber, check)
        run: |
          gofusa sci -output sci.json
          gofusa tara
          gofusa coupling
          gofusa boundary
          gofusa cyber
          gofusa check --output cyber-plan.json

      # `gofusa sas` (DO-178C §11.20 Software Accomplishment Summary) asserts
      # all 20 lifecycle data items are present and exits 1 if any are
      # missing. It must run after every other regenerate step above (SCI,
      # TARA, coupling, boundary, cyber) and after the coverage/gap-report
      # steps below, since it checks for coverage-report.json/
      # do178-gap-report.json too — those live at the repo root from the
      # previous release's commit, so it still passes on a from-scratch
      # checkout even before this run regenerates them again.
      #
      # go-FuSa v0.47.0 added two new required lifecycle items relative to
      # the v0.36.0 baseline this job used to run: the TARA report
      # (`gofusa tara`, ISO 21434 Chapter 9 — added above) and the audit
      # pack (`gofusa audit-pack`, below). Before those two commands were
      # added, `gofusa sas` always failed with 18/20 items present, and
      # because it ran mid-chain in a `bash -e` step, that failure silently
      # aborted the rest of the "Regenerate lifecycle evidence" step too
      # (coupling/boundary/cyber never ran) — see #105. Both new artifacts
      # are already covered by /audit-pack.zip and /tara.json in
      # .gitignore: they are regenerated evidence for this workflow's own
      # SAS gate, not files this repo tracks in git history.
      - name: Bundle audit pack (required lifecycle item for SAS)
        run: gofusa audit-pack

      - name: Regenerate Software Accomplishment Summary (DO-178C §11.20)
        run: gofusa sas

      - name: Regenerate structural coverage report
        run: |
          go test -short -coverprofile=coverage.out ./... || true
          gofusa coverage -format json -output coverage-report.json coverage.out || true
          rm -f coverage.out

      - name: Regenerate compliance gap reports
        # These commands always write their report file but exit non-zero when
        # gaps exist (expected — they are reports, not gates). `|| true` keeps
        # the regenerate step from aborting under `bash -e`.
        run: |
          gofusa iec61508 -output iec61508-gap-report.json -format json || true
          gofusa iso26262 -output iso26262-gap-report.json -format json || true
          gofusa iec62443 -output iec62443-gap-report.json -format json -sl SL-2 || true
          gofusa do178 -output do178-gap-report.json -format json || true
          gofusa iso21434 -output iso21434-gap-report.json -format json || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit regenerated artifacts
        run: |
          TAG="${{ github.ref_name }}"
          git add fmea.csv fmea.json \
                  safety-case.json safety-case.md safety-case.mermaid \
                  sbom.json provenance.json artifact-manifest.json \
                  sci.json sas.md coupling-report.json coverage-report.json \
                  cyber-report.json cyber-plan.json boundary.mermaid \
                  iec61508-gap-report.json iso26262-gap-report.json iec62443-gap-report.json \
                  do178-gap-report.json iso21434-gap-report.json
          # Only commit if there are actual changes.
          if git diff --cached --quiet; then
            echo "No artifact changes for $TAG — nothing to commit."
          else
            git commit \
              -m "chore: regenerate safety artifacts for $TAG [skip ci]" \
              -m "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            # main is a protected branch; the default GITHUB_TOKEN cannot push to
            # it directly. Treat a protected-branch rejection as a warning rather
            # than a hard failure so the release workflow stays green. The
            # artifact-in-VCS strategy under branch protection is tracked in #72.
            if ! git push origin HEAD:refs/heads/main; then
              echo "::warning::Could not push regenerated artifacts to protected main; update them via PR (see issue #72 for the artifact-in-VCS strategy decision)."
            fi
          fi

      # #137: the SBOM/provenance/manifest were regenerated and committed to
      # the repo tree above, but were never attached to the GitHub Release or
      # attested — a consumer had to know to dig through the tagged tree
      # instead of using the standard release-asset / `gh attestation verify`
      # UX. Attach them as downloadable assets here.
      - name: Attach safety-evidence artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Attaching requires a GitHub Release to already exist for this tag
          # (this repo's convention creates the Release, with its own
          # hand-written notes, around the same time the tag is pushed — this
          # workflow does not create/edit the Release itself). If it hasn't
          # landed yet, warn rather than fail the whole regenerate job; the
          # assets can be attached with a re-run once the Release exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              sbom.json sbom-spdx-3.0.1.json provenance.json artifact-manifest.json \
              safety-case.json safety-case.md sas.md
          else
            echo "::warning::No GitHub Release found for $TAG — SBOM/provenance/manifest assets were not attached. Re-run this workflow (or attach manually with 'gh release upload') once the Release exists."
          fi

      # Build provenance attestation (SLSA), verifiable with
      # `gh attestation verify sbom.json --repo SoundMatt/go-DDS` etc. —
      # independent of whether the Release itself exists yet, so this always
      # runs on the tag push.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            sbom.json
            sbom-spdx-3.0.1.json
            provenance.json
            artifact-manifest.json
