name: Release

# Runs on every vX.Y.Z tag push.
# Regenerates all gofusa safety artifacts (fmea, safety-case, sbom,
# provenance, artifact-manifest) and commits them back to main so the
# committed files always reflect the exact state at each release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to push the artifact-update commit

jobs:
  regenerate-safety-artifacts:
    name: Regenerate safety artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so we can push back to main.
          fetch-depth: 0
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.30.0

      - name: Regenerate dFMEA table
        run: gofusa fmea -cyber

      - name: Regenerate safety case
        run: gofusa safety-case

      - name: Regenerate SBOM, provenance, and artifact manifest
        run: gofusa release

      - name: Regenerate compliance gap reports
        # These commands always write their report file but exit non-zero when
        # gaps exist (expected — they are reports, not gates). `|| true` keeps
        # the regenerate step from aborting under `bash -e`.
        run: |
          gofusa iec61508 -output iec61508-gap-report.json -format json || true
          gofusa iso26262 -output iso26262-gap-report.json -format json || true
          gofusa iec62443 -output iec62443-gap-report.json -format json -sl SL-2 || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit regenerated artifacts
        run: |
          TAG="${{ github.ref_name }}"
          git add fmea.csv fmea.json \
                  safety-case.json safety-case.md safety-case.mermaid \
                  sbom.json provenance.json artifact-manifest.json \
                  iec61508-gap-report.json iso26262-gap-report.json iec62443-gap-report.json
          # Only commit if there are actual changes.
          if git diff --cached --quiet; then
            echo "No artifact changes for $TAG — nothing to commit."
          else
            git commit \
              -m "chore: regenerate safety artifacts for $TAG [skip ci]" \
              -m "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            # main is a protected branch; the default GITHUB_TOKEN cannot push to
            # it directly. Treat a protected-branch rejection as a warning rather
            # than a hard failure so the release workflow stays green. The
            # artifact-in-VCS strategy under branch protection is tracked in #72.
            if ! git push origin HEAD:refs/heads/main; then
              echo "::warning::Could not push regenerated artifacts to protected main; update them via PR (see issue #72 for the artifact-in-VCS strategy decision)."
            fi
          fi
